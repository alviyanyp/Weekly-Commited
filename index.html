<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Commited PPIC Klaten</title>
<meta name="theme-color" content="#153b35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekly Commited PPIC Klaten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#153b35;font-family:Inter,Segoe UI,Arial,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6f8;display:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#d7f1e4;text-align:center;padding:24px}
#splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px #0005}
#splash b{font-size:18px}#splash small{color:#9bbdb2;font-size:13px;max-width:320px}
.bar{width:160px;height:4px;border-radius:4px;background:#ffffff22;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#61d39b;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#retry{display:none;margin-top:6px;border:0;border-radius:10px;padding:10px 18px;font-weight:800;background:#61d39b;color:#153b35;cursor:pointer}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>Weekly Commited PPIC Klaten</b><div class="bar"><i></i></div><small id="msg">Memuat versi terbaru dari Google Drive…</small><button id="retry">Coba lagi</button></div>
<iframe id="app" title="Weekly Commited PPIC Klaten" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<script>
// URL Apps Script /exec yang sama dengan yang dipakai dashboard
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyiTVdZ61iHXKu2S2iJHrTif6uJyOX-Y1DJFUXquWLyf_nz48iGU5gVXMenZnlv5Xev/exec';
const KEY='weeklyPpicHtml';
const $=id=>document.getElementById(id);
function jsonp(params,timeout){return new Promise((res,rej)=>{const cb='appCb_'+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{done();rej(new Error('Waktu habis'))},timeout||45000);function done(){clearTimeout(t);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej(new Error('Gagal menghubungi Apps Script'))};s.src=APPS_SCRIPT_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(s)})}
function show(html,ver,file){const inject='<script>window.APP_VERSION='+JSON.stringify(ver||'')+';window.APP_FILE='+JSON.stringify(file||'')+';window.APP_INSTALLED=true;<\/script>';
 html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+inject):inject+html;const f=$('app');f.srcdoc=html;f.style.display='block';f.onload=()=>{$('splash').style.display='none';}}
async function load(){$('retry').style.display='none';$('msg').textContent='Memuat versi terbaru dari Google Drive…';let cached=null;try{cached=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 try{const d=await jsonp({action:'apphtml'});if(!d||!d.ok||!d.html)throw new Error(d&&d.error||'Data aplikasi kosong');try{localStorage.setItem(KEY,JSON.stringify({html:d.html,ver:d.version,file:d.file}))}catch(e){}show(d.html,d.version,d.file)}
 catch(e){if(cached&&cached.html){show(cached.html,(cached.ver||'')+' (offline)',cached.file)}else{$('msg').textContent='Tidak bisa memuat aplikasi: '+e.message+'. Periksa internet lalu coba lagi.';$('retry').style.display='inline-block'}}}
$('retry').onclick=load;load();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
